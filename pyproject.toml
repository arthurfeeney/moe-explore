requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "moe_explore"
version = "0.1.0"
description = "Playing around with some MoE Implementations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "imgcat>=0.6.0",
  "matplotlib>=3.10.3",
  "numpy",
  "nvidia-cutlass-dsl==4.1.0",
  "pandas>=2.3.0",
  "pytest",
  "seaborn",
  "triton==3.4.0", # depends on torch version
  "torch==2.8.0",
  "torchvision>=0.22.0",
]

[project.optional-dependencies]
tests = [
  # models from transformers are used as reference implementations.
  "transformers",
  "lm_eval",
]
bench = [
  # transformers and some inference engines are used for performance comparisons.
  "transformers",
  "llnl-hatchet", # used by proton-viewer
  #"megablocks[gg]==0.10.0", # dmoe can use grouped gemm
  #"megatron-core",
  "pynvml",
  "scattermoe",
  #"transformer-engine[pytorch]" # used by megatron
]
scripts = [
  "accelerate",
  "datasets",
  "transformers",
]
all = [
  "moe_explore[tests]", 
  "moe_explore[bench]", 
  "moe_explore[scripts]"
]

[tool.uv]
no-build-isolation-package = ["transformer-engine"]

[tool.uv.sources]
torch = [
  # For developing on macos, need cpu torch
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
scattermoe = { git = "https://github.com/shawntan/scattermoe.git" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
  "tests"
]
